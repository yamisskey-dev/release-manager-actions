name: "Release Manager/Create Target"

on:
  workflow_call:
    inputs:
      user:
        type: string
        description: 'User name'
        default: 'github-actions[bot]'
      version_increment_script:
        type: string
        description: 'Script to increment version'
        default: |
          #!/bin/bash
          #
      difference_path:
        type: string
        description: 'Changelog file to use'
        default: 'DIFFERENCE.md'
      indent:
        type: string
        description: '`tab` or number of spaces'
        default: tab
      stable_branch:
        type: string
        description: 'Branch to merge the release branch into'
        default: 'stable'
      draft_prerelease_channel:
        type: string
        description: 'Prerelease channel for draft PR'
        default: 'beta'
    secrets:
      RELEASE_APP_ID:
        description: 'App ID for app to create release'
      RELEASE_APP_PRIVATE_KEY:
        description: 'Private key for app to create release'
permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-target:
    name: "Create PR and tag"
    runs-on: ubuntu-latest
    # 日付ベースでリリースを作成
    steps:
      - uses: actions/checkout@v4
      - name: git config
        run: |
          git config --local user.email "$USER@users.noreply.github.com"
          git config --local user.name "$USER"
        env:
          USER: ${{ inputs.user }}
      # jqでpackage.jsonから現在のバージョンを取得
      - name: Get current version
        run: |
          jq -r '.version' package.json
          echo "current_version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT
        id: get_current_version
      # バージョンをインクリメント
      - name: Increment version
        uses: actions/script@v7
        env:
          CURRENT_VERSION: ${{ steps.get_current_version.outputs.current_version }}
        with:
          script: |
            const currentVersion = process.env.CURRENT_VERSION;
            console.log('DEBUG: Current version: ' + currentVersion);
            
            // Yamisskey形式の簡易チェック
            if (currentVersion.includes('-nayami-') || currentVersion.includes('-yami-')) {
              console.log('DEBUG: Yamisskey version format detected');
              
              const parts = currentVersion.split('-');
              if (parts.length >= 3) {
                const baseVersion = parts[0];
                const yamisskeyType = parts[1];
                const yamisskeyVersions = parts[2].split('.');
                
                if (yamisskeyVersions.length === 3) {
                  const yMajor = yamisskeyVersions[0];
                  const yMinor = yamisskeyVersions[1];
                  const yPatch = yamisskeyVersions[2];
                  
                  // nayamiの場合はyamiに変換（リリース用）、yamiの場合はパッチ番号をインクリメント
                  let releaseType = 'yami';
                  let releasePatch = yPatch;
                  
                  if (yamisskeyType === 'nayami') {
                    console.log('DEBUG: Converting nayami to yami for release');
                    // nayami→yamiの変換（パッチ番号はそのまま）
                  } else if (yamisskeyType === 'yami') {
                    console.log('DEBUG: Incrementing existing yami version');
                    // yamiの場合はパッチ番号をインクリメント
                    releasePatch = Number(yPatch) + 1;
                  }
                  
                  const releaseVersion = baseVersion + '-' + releaseType + '-' + yMajor + '.' + yMinor + '.' + releasePatch;
                  console.log('DEBUG: Release version: ' + releaseVersion);
                  return releaseVersion;
                }
              }
            }
            
            // フォールバック: 基本的なバージョン形式
            console.log('DEBUG: Using basic version increment');
            const versionParts = currentVersion.split('.');
            if (versionParts.length >= 3) {
              const major = versionParts[0];
              const minor = versionParts[1];
              const patchPart = versionParts[2];
              const patch = Number(patchPart.split('-')[0]) + 1;
              
              const incrementedVersion = major + '.' + minor + '.' + patch;
              console.log('DEBUG: Basic increment result: ' + incrementedVersion);
              return incrementedVersion;
            }
            
            throw new Error('Unsupported version format: ' + currentVersion);
          result-encoding: string
        id: target_version
      - name: Set release version
        run: |
          # シンプルなYamisskeyバージョン検出（複雑な正規表現を回避）
          if [[ "$TARGET_VERSION" == *"-nayami-"* ]] || [[ "$TARGET_VERSION" == *"-yami-"* ]]; then
            echo "result=$TARGET_VERSION" >> $GITHUB_OUTPUT
            echo "✅ Yamisskey version detected - using pure format: $TARGET_VERSION"
          else
            # draft_prerelease_channelが設定されている場合のみサフィックスを追加
            if [[ -n "$PRERELEASE_CHANNEL" ]]; then
              echo "result=$TARGET_VERSION-$PRERELEASE_CHANNEL.0" >> $GITHUB_OUTPUT
              echo "Regular version with prerelease: $TARGET_VERSION -> $TARGET_VERSION-$PRERELEASE_CHANNEL.0"
            else
              echo "result=$TARGET_VERSION" >> $GITHUB_OUTPUT
              echo "Regular version: $TARGET_VERSION"
            fi
          fi
        id: release_version
        env:
          TARGET_VERSION: ${{ steps.target_version.outputs.result }}
          PRERELEASE_CHANNEL: ${{ inputs.draft_prerelease_channel }}
      # Yamisskey運用：package.json手動管理（自動編集なし）
      - name: Skip package.json update (Yamisskey manual workflow)
        run: |
          echo "INFO: Yamisskeyワークフローでは手動でpackage.jsonを管理します"
          echo "INFO: ターゲット作成時も手動バージョン管理を前提とします"
          echo "INFO: DIFFERENCE.md更新、タグ作成、リリース作成のみ実行します"
          echo "INFO: Release version: $VERSION_NAME"
        env:
          VERSION_NAME: ${{ steps.release_version.outputs.result }}
      # DIFFERENCE.mdのUnreleasedの内容を取得
      - name: Get changelog
        uses: yamisskey-dev/release-manager-actions/.github/actions/get-changelog@v2-yamisskey
        with:
          version: Unreleased
          difference_path: ${{ inputs.difference_path }}
        id: changelog
      # DIFFERENCE.mdのバージョンの書き換え
      - name: Modify DIFFERENCE.md
        run: |
          sed -i "s/## Unreleased/## $TARGET_VERSION/" "$DIFFERENCE_PATH"
        env:
          TARGET_VERSION: ${{ steps.target_version.outputs.result }}
          DIFFERENCE_PATH: ${{ inputs.difference_path }}
      # DIFFERENCE.md変更をコミット（タグ作成はmasterマージ時に延期）
      - name: Commit DIFFERENCE.md (defer tag creation to master merge)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "INFO: Changes detected (DIFFERENCE.md), committing..."
            git commit -am "Bump version to $VERSION_NAME"
            git push
          else
            echo "INFO: No changes to commit"
          fi
          echo "INFO: タグ作成とリリース作成はmasterブランチマージ時に実行されます"
        env:
          VERSION_NAME: ${{ steps.release_version.outputs.result }}
          TARGET_VERSION: ${{ steps.target_version.outputs.result }}
      # 外部アプリトークンを作成（PR作成用）
      - uses: actions/create-github-app-token@v1
        id: release-app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # PRを作成
      - name: Create PR
        run: |
          gh pr create --draft --title "Release: $TARGET_VERSION" --body "$CHANGELOG" --head "$GITHUB_REF_NAME" --base "master"
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          TARGET_VERSION: ${{ steps.target_version.outputs.result }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
