name: "Release Manager/Go Merge"

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        description: PR number
        required: true
      user:
        type: string
        description: User name
        default: github-actions[bot]
      changes_template:
        type: string
        description: 'Template for CHANGELOG.md'
        default: |
          ## Unreleased
          -
      difference_path:
        type: string
        description: 'Changelog file to use'
        default: 'DIFFERENCE.md'
      indent:
        type: string
        description: '`tab` or number of spaces'
        default: tab
    secrets:
      RELEASE_APP_ID:
        description: 'App ID for app to create release'
      RELEASE_APP_PRIVATE_KEY:
        description: 'Private key for app to create release'

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  merge:
    name: "Go Merge"
    runs-on: ubuntu-latest
    if: ${{ inputs.pr_number != '' }}
    steps:
      # 外部アプリトークンを作成（checkout / push / tag push で使用、bypass list の対象）
      - uses: actions/create-github-app-token@v1
        id: release-app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # PR 情報取得のため一旦 default branch を App token で checkout
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.release-app-token.outputs.token }}
      - name: Get PR head ref
        id: get_pr
        run: |
          pr_json=$(gh pr view "$PR_NUMBER" --json isDraft,headRefName)
          echo "pr_is_draft=$(echo $pr_json | jq -r '.isDraft')" >> $GITHUB_OUTPUT
          echo "pr_head_ref=$(echo $pr_json | jq -r '.headRefName')" >> $GITHUB_OUTPUT
          echo "$pr_json"
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
      # PR ブランチを App token で checkout（checkout-pr の内部 checkout が
      # default GITHUB_TOKEN で extraheader を上書きしてしまう問題の回避）
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_pr.outputs.pr_head_ref }}
          token: ${{ steps.release-app-token.outputs.token }}
      - name: git config
        run: |
          git config --local user.email "$USER@users.noreply.github.com"
          git config --local user.name "$USER"
        env:
          USER: ${{ inputs.user }}
      - name: Get target version
        uses: misskey-dev/release-manager-actions/.github/actions/get-target-version@v2
        id: v

      # mergeable: UNKNOWNを回避したい
      - name: 'Pre-fetch PR data'
        run: |
          gh pr view "$PR_NUMBER" --json mergeable
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
      - name: Sleep
        run: sleep 5s

      - name: 'Fetch PR data'
        id: pr-data
        run: |
          echo "data=$(gh pr view "$PR_NUMBER" --json baseRefName,reviewDecision,isDraft,mergeStateStatus,statusCheckRollup,mergeable)" >> $GITHUB_OUTPUT
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
      - name: 'Check Mergeable: compare'
        uses: actions/script@v7
        env:
          pr_data: ${{ steps.pr-data.outputs.data }}
        with:
          script: |
            const pr = JSON.parse(process.env.pr_data);
            if (pr.isDraft) {
              throw new Error('PR is draft');
            }
            if (pr.reviewDecision !== 'APPROVED') {
              throw new Error('reviewDecision is not APPROVED (' + pr.reviewDecision + '). You must approve the PR before merging.');
            }
            if (pr.mergeable !== 'MERGEABLE') {
              throw new Error('Not mergeable: ' + pr.mergeable);
            }
            if (pr.mergeStateStatus !== 'CLEAN' && pr.mergeStateStatus !== 'BLOCKED') {
              throw new Error('MergeStateStatus is not CLEAN: ' + pr.mergeStateStatus);
            }
            if (pr.statusCheckRollup.find(s => s.conclusion !== 'SUCCESS' && s.conclusion !== 'COMPLETED' && s.state !== 'SUCCESS' && s.state !== 'COMPLETED')) {
              throw new Error('Not all status checks are success');
            }

      # Yamisskey運用：package.json手動管理（自動編集なし）
      - name: Skip package.json update (Yamisskey manual workflow)
        run: |
          echo "INFO: Yamisskeyワークフローでは手動でpackage.jsonを管理します"
          echo "INFO: タグ作成とリリース作成のみ実行します"
          echo "INFO: Target version: $TARGET_VERSION"
        env:
          TARGET_VERSION: ${{ steps.v.outputs.target_version }}

      # commit, push（DIFFERENCE.md変更がある場合のみ）
      - name: Commit changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "INFO: Changes detected (likely DIFFERENCE.md), committing..."
            git commit -am "Release: $TARGET_VERSION"
            git push
          else
            echo "INFO: No changes to commit (expected for manual workflow)"
          fi
        env:
          TARGET_VERSION: ${{ steps.v.outputs.target_version }}

      # DIFFERENCE.mdの内容を取得
      - name: Get changelog
        uses: yamisskey-dev/release-manager-actions/.github/actions/get-changelog@v2-yamisskey
        with:
          version: ${{ steps.v.outputs.target_version }}
          difference_path: ${{ inputs.difference_path }}
        id: changelog

      - name: Create tag
        run: |
          # 既存タグをチェックして、存在する場合は削除してから作成
          if git ls-remote --tags origin | grep -q "refs/tags/$TARGET_VERSION$"; then
            echo "Tag $TARGET_VERSION already exists, deleting remote tag..."
            git push origin ":refs/tags/$TARGET_VERSION"
            # ローカルタグも削除
            git tag -d "$TARGET_VERSION" 2>/dev/null || true
          fi
          
          git tag "$TARGET_VERSION"
          git push origin "$TARGET_VERSION"
          echo "Tag $TARGET_VERSION successfully pushed to remote"
        env:
          TARGET_VERSION: ${{ steps.v.outputs.target_version }}

      # リリースを作成
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          TARGET_VERSION: ${{ steps.v.outputs.target_version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          gh release create "$TARGET_VERSION" --title "$TARGET_VERSION" --notes "$CHANGELOG"

      # Merge
      # (Retry because mergeable can unknown after push)
      - name: Merge PR
        uses: prichey/retry@c92c7ba2f5f4d0b3b7b2b04cc5c6672f9c884a3f
        with:
          command: |
            gh pr merge "$PR_NUMBER" --merge --admin
          timeout_seconds: 30
          max_attempts: 3
          retry_wait_seconds: 5
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}

      # DIFFERENCE.mdにUnreleasedのテンプレートを追加
      - name: Prepend DIFFERENCE template
        env:
          CHANGES_TEMPLATE: ${{ inputs.changes_template }}
          DIFFERENCE_PATH: ${{ inputs.difference_path }}
        run: sed -i "$(sed -n '/^## /=' "$DIFFERENCE_PATH" | head -1)i $(echo "${CHANGES_TEMPLATE}" | sed -r 's/$/\\n/' | while IFS= read -r line; do echo -n "$line"; done)" "$DIFFERENCE_PATH"
      - name: Update DIFFERENCE.md (prepend template)
        env:
          DIFFERENCE_PATH: ${{ inputs.difference_path }}
        run: |
          git commit -am "[skip ci] Update $DIFFERENCE_PATH (prepend template)"
          git push
