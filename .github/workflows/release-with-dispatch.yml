name: "Release Manager [Dispatch]"

on:
  workflow_dispatch:
    inputs:
      ## Specify the type of the next release.
      #version_increment_type:
      #  type: choice
      #  description: 'VERSION INCREMENT TYPE'
      #  default: 'patch'
      #  required: false
      #  options:
      #    - 'major'
      #    - 'minor'
      #    - 'patch'
      merge:
        type: boolean
        description: 'MERGE RELEASE BRANCH TO MAIN'
        default: false
      start-rc:
        type: boolean
        description: 'Start Release Candidate'
        default: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  get-pr:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.get_pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      # headが$GITHUB_REF_NAME, baseがmasterかつopenのPRを1つ取得
      - name: Get PRs
        run: |
          echo "pr_number=$(gh pr list --limit 1 --search "head:$GITHUB_REF_NAME base:master is:open" --json number  --jq '.[] | .number')" >> $GITHUB_OUTPUT
        id: get_pr

  merge:
    uses: yamisskey-dev/release-manager-actions/.github/workflows/merge.yml@v2-yamisskey
    needs: get-pr
    if: ${{ needs.get-pr.outputs.pr_number != '' && inputs.merge == true }}
    with:
      pr_number: ${{ needs.get-pr.outputs.pr_number }}
      user: 'github-actions[bot]'
      difference_path: 'DIFFERENCE.md'
      # Text to prepend to the changelog
      # The first line must be `## Unreleased`
      changes_template: |
        ## Unreleased
        ### Feat
        -
        
        ### Enhance
        -
        
        ### Client
        -
        
        ### Server
        -
        
      indent: '\t'
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  create-prerelease:
    uses: yamisskey-dev/release-manager-actions/.github/workflows/create-prerelease.yml@v2-yamisskey
    needs: get-pr
    if: ${{ needs.get-pr.outputs.pr_number != '' && inputs.merge != true  }}
    with:
      pr_number: ${{ needs.get-pr.outputs.pr_number }}
      user: 'github-actions[bot]'
      difference_path: 'DIFFERENCE.md'
      indent: '\t'
      draft_prerelease_channel: alpha
      ready_start_prerelease_channel: beta
      prerelease_channel: ${{ inputs.start-rc && 'rc' || '' }}
      reset_number_on_channel_change: true
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  create-target:
    uses: yamisskey-dev/release-manager-actions/.github/workflows/create-target.yml@v2-yamisskey
    needs: get-pr
    if: ${{ needs.get-pr.outputs.pr_number == '' }}
    with:
      user: 'github-actions[bot]'
      # The script for version increment.
      # process.env.CURRENT_VERSION: The current version.
      #
      # Yamisskey versioning (yyyy.MM.patch-nayami-x.x.x or yyyy.MM.patch-yami-x.x.x) example
      version_increment_script: |
        const currentVersion = process.env.CURRENT_VERSION;
        console.log('DEBUG: Current version: ' + currentVersion);
        
        // Yamisskey形式の簡易チェック
        if (currentVersion.includes('-nayami-') || currentVersion.includes('-yami-')) {
          console.log('DEBUG: Yamisskey version format detected');
          
          const parts = currentVersion.split('-');
          if (parts.length >= 3) {
            const baseVersion = parts[0];
            const yamisskeyType = parts[1];
            const yamisskeyVersions = parts[2].split('.');
            
            if (yamisskeyVersions.length === 3) {
              const yMajor = yamisskeyVersions[0];
              const yMinor = yamisskeyVersions[1];
              const yPatch = yamisskeyVersions[2];
              
              // nayamiの場合はyamiに変換（リリース用）、yamiの場合はパッチ番号をインクリメント
              let releaseType = 'yami';
              let releasePatch = yPatch;
              
              if (yamisskeyType === 'nayami') {
                console.log('DEBUG: Converting nayami to yami for release');
                // nayami→yamiの変換（パッチ番号はそのまま）
              } else if (yamisskeyType === 'yami') {
                console.log('DEBUG: Incrementing existing yami version');
                // yamiの場合はパッチ番号をインクリメント
                releasePatch = Number(yPatch) + 1;
              }
              
              const releaseVersion = baseVersion + '-' + releaseType + '-' + yMajor + '.' + yMinor + '.' + releasePatch;
              console.log('DEBUG: Release version: ' + releaseVersion);
              return releaseVersion;
            }
          }
        }
        
        // フォールバック：基本的なバージョン形式
        console.log('DEBUG: Using basic version increment');
        const versionParts = currentVersion.split('.');
        if (versionParts.length >= 3) {
          const major = versionParts[0];
          const minor = versionParts[1];
          const patchPart = versionParts[2];
          const patch = Number(patchPart.split('-')[0]) + 1;
          
          const incrementedVersion = major + '.' + minor + '.' + patch;
          console.log('DEBUG: Basic increment result: ' + incrementedVersion);
          return incrementedVersion;
        }
        
        throw new Error('Unsupported version format: ' + currentVersion);
      ##Semver example
      #version_increment_script: |
      #  const [major, minor, patch] = process.env.CURRENT_VERSION.split('.');
      #  if ("${{ inputs.version_increment_type }}" === "major") {
      #    return `${Number(major) + 1}.0.0`;
      #  } else if ("${{ inputs.version_increment_type }}" === "minor") {
      #    return `${major}.${Number(minor) + 1}.0`;
      #  } else {
      #    return `${major}.${minor}.${Number(patch) + 1}`;
      #  }
      difference_path: 'DIFFERENCE.md'
      indent: '\t'
      stable_branch: master
      draft_prerelease_channel: alpha
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
