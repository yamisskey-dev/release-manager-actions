name: "Yamisskey Version Handler"
description: "Handle Yamisskey version format (base-nayami-x.x.x or base-yami-x.x.x)"
inputs:
  version:
    description: "Current version"
    required: true
  operation:
    description: "Operation to perform: increment_yamisskey, extract_base, extract_yamisskey"
    required: true
    default: "increment_yamisskey"
outputs:
  result:
    description: "Result of the operation"
    value: ${{ steps.handler.outputs.result }}
  base_version:
    description: "Base version (e.g., 2024.8.0)"
    value: ${{ steps.handler.outputs.base_version }}
  yamisskey_version:
    description: "Yamisskey version suffix (e.g., -nayami-1.2.3 or -yami-1.2.3)"
    value: ${{ steps.handler.outputs.yamisskey_version }}
  yamisskey_type:
    description: "Yamisskey type (na or empty for yami)"
    value: ${{ steps.handler.outputs.yamisskey_type }}
runs:
  using: "composite"
  steps:
    - name: Handle Yamisskey version
      uses: actions/script@v7
      id: handler
      env:
        VERSION: ${{ inputs.version }}
        OPERATION: ${{ inputs.operation }}
      with:
        script: |
          const version = process.env.VERSION;
          const operation = process.env.OPERATION;
          
          // Yamisskeyバージョン形式の正規表現 (nayami, yami対応)
          const yamisskeyRegex = /^(\d+\.\d+\.\d+)-(na)?yami-(\d+)\.(\d+)\.(\d+)$/;
          const match = version.match(yamisskeyRegex);
          
          let baseVersion = '';
          let yamisskeyVersion = '';
          let yamisskeyType = '';
          
          if (match) {
            const [, base, prefix, major, minor, patch] = match;
            baseVersion = base;
            const fullType = prefix ? prefix + 'yami' : 'yami';
            yamisskeyVersion = '-' + fullType + '-' + major + '.' + minor + '.' + patch;
            yamisskeyType = prefix || '';
          } else {
            // 通常のバージョン形式の場合
            baseVersion = version.split('-')[0];
            yamisskeyVersion = '';
            yamisskeyType = '';
          }
          
          // 操作に応じて結果を設定
          let result = '';
          switch (operation) {
            case 'extract_base':
              result = baseVersion;
              break;
            case 'extract_yamisskey':
              result = yamisskeyVersion;
              break;
            case 'increment_yamisskey':
              if (match) {
                const [, base, prefix, major, minor, patch] = match;
                const fullType = prefix ? prefix + 'yami' : 'yami';
                result = base + '-' + fullType + '-' + major + '.' + minor + '.' + (Number(patch) + 1);
              } else {
                // 新しいYamisskeyバージョンとして開始（デフォルトはnayami）
                result = baseVersion + '-nayami-1.0.0';
              }
              break;
            default:
              throw new Error(`Unknown operation: ${operation}`);
          }
          
          // 出力を設定
          core.setOutput('result', result);
          core.setOutput('base_version', baseVersion);
          core.setOutput('yamisskey_version', yamisskeyVersion);
          core.setOutput('yamisskey_type', yamisskeyType);
          
          return result;
        result-encoding: string