name: "Yamisskey Version Handler"
description: "Handle Yamisskey version format (base-yami-x.x.x)"
inputs:
  version:
    description: "Current version"
    required: true
  operation:
    description: "Operation to perform: increment_yamisskey, extract_base, extract_yamisskey"
    required: true
    default: "increment_yamisskey"
outputs:
  result:
    description: "Result of the operation"
    value: ${{ steps.handler.outputs.result }}
  base_version:
    description: "Base version (e.g., 2024.8.0)"
    value: ${{ steps.handler.outputs.base_version }}
  yamisskey_version:
    description: "Yamisskey version suffix (e.g., -yami-1.2.3)"
    value: ${{ steps.handler.outputs.yamisskey_version }}
runs:
  using: "composite"
  steps:
    - name: Handle Yamisskey version
      uses: actions/script@v7
      id: handler
      env:
        VERSION: ${{ inputs.version }}
        OPERATION: ${{ inputs.operation }}
      with:
        script: |
          const version = process.env.VERSION;
          const operation = process.env.OPERATION;

          // Yamisskeyバージョン形式の正規表現 (yami統一)
          const yamisskeyRegex = /^(\d+\.\d+\.\d+)-yami-(\d+)\.(\d+)\.(\d+)$/;
          const match = version.match(yamisskeyRegex);

          let baseVersion = '';
          let yamisskeyVersion = '';

          if (match) {
            const [, base, major, minor, patch] = match;
            baseVersion = base;
            yamisskeyVersion = '-yami-' + major + '.' + minor + '.' + patch;
          } else {
            // 通常のバージョン形式の場合
            baseVersion = version.split('-')[0];
            yamisskeyVersion = '';
          }

          // 操作に応じて結果を設定
          let result = '';
          switch (operation) {
            case 'extract_base':
              result = baseVersion;
              break;
            case 'extract_yamisskey':
              result = yamisskeyVersion;
              break;
            case 'increment_yamisskey':
              if (match) {
                const [, base, major, minor, patch] = match;
                result = base + '-yami-' + major + '.' + minor + '.' + (Number(patch) + 1);
              } else {
                // 新しいYamisskeyバージョンとして開始
                result = baseVersion + '-yami-1.0.0';
              }
              break;
            default:
              throw new Error(`Unknown operation: ${operation}`);
          }

          // 出力を設定
          core.setOutput('result', result);
          core.setOutput('base_version', baseVersion);
          core.setOutput('yamisskey_version', yamisskeyVersion);

          return result;
        result-encoding: string