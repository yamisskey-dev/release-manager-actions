name: "Get target version"
description: "Get current version and target version from package.json (Yamisskey compatible)"
outputs:
  current_version:
    description: "current version"
    value: ${{ steps.get_current_version.outputs.current_version }}
  target_version:
    description: "target version"
    value: ${{ steps.next_target_version.outputs.result }}
  yamisskey_suffix:
    description: "yamisskey version suffix (e.g., -nayami-1.2.3)"
    value: ${{ steps.get_yamisskey_suffix.outputs.yamisskey_suffix }}
runs:
  using: "composite"
  steps:
    # jqでpackage.jsonから現在のバージョンを取得
    - name: Get current version
      run: |
        jq -r '.version' package.json
        echo "current_version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT
      id: get_current_version
      shell: bash
    # Yamisskeyサフィックスを抽出
    - name: Extract Yamisskey suffix
      run: |
        version="${{ steps.get_current_version.outputs.current_version }}"
        if [[ "$version" =~ -(na)yami-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          yamisskey_suffix=$(echo "$version" | sed -n 's/.*\(-(na)yami-[0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p')
          echo "yamisskey_suffix=${yamisskey_suffix}" >> $GITHUB_OUTPUT
        elif [[ "$version" =~ -yami-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          yamisskey_suffix=$(echo "$version" | sed -n 's/.*\(-yami-[0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p')
          echo "yamisskey_suffix=${yamisskey_suffix}" >> $GITHUB_OUTPUT
        else
          echo "yamisskey_suffix=" >> $GITHUB_OUTPUT
        fi
      id: get_yamisskey_suffix
      shell: bash
    # current_versionを加工してtarget_versionを取得（Yamisskey対応）
    - name: Get target version
      uses: actions/script@v7
      env:
        CURRENT_VERSION: ${{ steps.get_current_version.outputs.current_version }}
      with:
        script: |
          const version = process.env.CURRENT_VERSION;
          // Yamisskeyバージョン形式 (例: 2024.8.0-nayami-1.2.3, 2024.8.0-yami-1.2.3) の場合
          if (version.includes('-nayami-') || version.includes('-yami-')) {
            // ベースバージョン（2024.8.0）のみを返す
            return version.split('-')[0];
          }
          // 通常のバージョン形式の場合
          return version.split('-')[0];
        result-encoding: string
      id: next_target_version
